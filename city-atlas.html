<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Orbit Lower Manhattan and Seattle after dark in Diego Renteria’s interactive city atlas.">
  <meta name="theme-color" content="#0a1020">
  <title>City Atlas — Diego Renteria</title>
  <link rel="stylesheet" href="city-atlas.css?v=atlas-1">
</head>
<body>
  <header class="atlas-header">
    <a class="brand" href="./" aria-label="Diego’s portfolio">d<span>.</span></a>
    <a class="atlas-back" href="./">← <span>Back to the portfolio</span></a>
  </header>
  <main class="atlas-layout">
    <div class="atlas-scene" aria-label="Interactive 3D neighborhood" tabindex="0" id="atlas-scene">
      <canvas id="atlas-sky" aria-hidden="true"></canvas>
      <canvas id="atlas-fx" aria-hidden="true"></canvas>
      <div id="atlas-render"></div>
      <div class="atlas-pins" id="atlas-pins"></div>
    </div>
    <section class="atlas-intro" aria-labelledby="city-name">
      <p class="atlas-eyebrow">City Atlas</p>
      <h1 id="city-name">Seattle</h1>
      <p id="city-summary">From Pike Place down to the lights on Elliott Bay.</p>
      <div class="atlas-cities" role="group" aria-label="Choose a city">
        <button type="button" data-city="sea" aria-pressed="true">Seattle</button>
        <button type="button" data-city="nyc" aria-pressed="false">New York</button>
      </div>
      <p class="atlas-place-caption">Landmarks</p>
      <div class="atlas-places" id="atlas-places"></div>
    </section>
    <section class="atlas-sky-menu" aria-label="Choose a sky">
      <label for="sky-select">Backdrop</label>
      <select id="sky-select" aria-describedby="sky-description"></select>
      <p id="sky-description"></p>
      <a id="sky-on-city" href="./">See this sky on Diego’s city ↗</a>
    </section>
    <section class="atlas-inspector" id="atlas-inspector" aria-label="Map selection" hidden>
      <button id="close-inspector" type="button" aria-label="Close map selection">×</button>
      <p class="atlas-eyebrow" id="inspector-type"></p>
      <h2 id="inspector-name"></h2>
      <p id="inspector-detail"></p>
      <a id="inspector-link" href="./">Open location ↗</a>
    </section>
    <p class="atlas-status" id="atlas-status" role="status">Loading the city…</p>
    <div class="atlas-controls" role="group" aria-label="Globe camera">
      <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="reset-atlas">Full globe</button>
    </div>
    <p class="atlas-instructions">Drag to orbit <span>·</span> Scroll to zoom</p>
    <footer class="atlas-credit">
      <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a>
      <span>·</span>
      <a href="assets/atlas/CREDITS.md">Map and asset sources</a>
    </footer>
  </main>
  <script type="module" src="city-atlas.js?v=atlas-1"></script>
</body>
</html>
